<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QCC AI Chatbot Web Component Demo</title>
  <link rel="stylesheet" href="./dist/chatbot.css" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }

    .demo-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .box {
      position: fixed;
      right: 200px;
      bottom: 200px;
    }

    @media (max-width: 768px) {

      body {
        padding: 0px;
      }

      .demo-container {
        display: block;
      }

      .box {
        position: static;
      }

      .control-warp {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="control-warp">
    <button class="open-btn">点击打开</button>
    <button class="close-btn">点击关闭</button>
    <button class="clear-btn">点击查询</button>
  </div>

  <div class="demo-container">
    <qcc-ai-chatbot class="box" proxy-url="http://172.18.105.75:3002" provider="qwen" model="qwen-plus" title="企业 AI 助手"
      theme-color="#128bed" debug="true"></qcc-ai-chatbot>
  </div>

  <script type="module" src="./dist/qcc-ai-chatbot.js"></script>

  <script>
    const openBtn = document.querySelector('.open-btn');
    const closeBtn = document.querySelector('.close-btn');
    const clearBtn = document.querySelector('.clear-btn');
    const chatbot = document.querySelector('qcc-ai-chatbot');

    openBtn.addEventListener('click', () => {
      chatbot.open();
    });
    closeBtn.addEventListener('click', () => {
      chatbot.close();
    });
    clearBtn.addEventListener('click', () => {
      chatbot.open('查询企查查科技股份有限公司的工商信息，如企业类型、注册资本、成立日期、登记状态、行政区划等信息');
    });



  </script>
</body>

</html>
